[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
# ASGI (daphne), not WSGI gunicorn: the app serves Channels WebSocket consumers
# (ws/floor/, ws/cart/, ...) via core.routing:application. gunicorn core.wsgi
# speaks HTTP only and fails every WebSocket handshake. daphne serves both HTTP
# and WebSocket through the ProtocolTypeRouter.
command=daphne -b 0.0.0.0 -p 8000 core.routing:application
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopasgroup=true
killasgroup=true

[program:worker]
command=celery -A core worker -l info
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopasgroup=true
killasgroup=true

[program:beat]
command=celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler -f /tmp/celerybeat-schedule
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopasgroup=true
killasgroup=true
