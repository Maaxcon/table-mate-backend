openapi: 3.0.3
info:
  title: TableMate Platform API
  version: 1.0.0
  description: Real-time multi-tenant restaurant operational ecosystem backend.
paths:
  /api/auth/google/:
    post:
      operationId: auth_google_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuth'
        required: true
      security:
      - jwtAuth: []
      - jwt_Auth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '400':
          description: Google authentication failed.
  /api/auth/google/context/:
    post:
      operationId: auth_google_context_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleContext'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleContext'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleContext'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleContextResponse'
          description: ''
        '400':
          description: User is not a member of this restaurant.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_Auth: []
      - {}
      responses:
        '200':
          description: Refresh token cookie cleared.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeUpdate'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      security:
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/editor/layouts/:
    get:
      operationId: editor_layouts_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: published_at
        schema:
          type: string
          format: date-time
      - in: query
        name: published_by
        schema:
          type: integer
      - in: query
        name: version
        schema:
          type: integer
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLayoutList'
          description: ''
  /api/editor/layouts/{public_id}/:
    get:
      operationId: editor_layouts_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layout'
          description: ''
  /api/editor/tables/:
    get:
      operationId: editor_tables_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: capacity
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: shape
        schema:
          type: string
          enum:
          - booth
          - rectangle
          - round
          - square
        description: |-
          * `rectangle` - Rectangle
          * `round` - Round
          * `square` - Square
          * `booth` - Booth
      - in: query
        name: status
        schema:
          type: string
          enum:
          - free
          - occupied
        description: |-
          * `free` - Free
          * `occupied` - Occupied
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEditorTableList'
          description: ''
  /api/editor/tables/{public_id}/:
    get:
      operationId: editor_tables_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Editor
      security:
