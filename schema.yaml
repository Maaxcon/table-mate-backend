components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CreatedBySourceEnum:
      enum:
      - staff
      - customer
      - system
      type: string
      description: |-
        * `staff` - Staff
        * `customer` - Customer
        * `system` - System
    Layout:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
          readOnly: true
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        payload: {}
        published_at:
          type: string
          format: date-time
          nullable: true
        published_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - public_id
      - published_by
      - restaurant
      - updated_at
      - version
    Menu:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
        name:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        items:
          type: array
          items:
            type: integer
          readOnly: true
        categories:
          type: array
          items:
            type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - categories
      - created_at
      - items
      - name
      - public_id
      - restaurant
      - updated_at
    MenuCategory:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        menu:
          type: integer
        name:
          type: string
          maxLength: 255
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - menu
      - name
      - public_id
      - updated_at
    MenuItem:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
        menu:
          type: integer
          readOnly: true
        category:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        is_available:
          type: boolean
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - menu
      - name
      - price
      - public_id
      - restaurant
      - updated_at
    NullEnum:
      enum:
      - null
    Order:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
        session:
          type: integer
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        created_by_source:
          $ref: '#/components/schemas/CreatedBySourceEnum'
        source:
          $ref: '#/components/schemas/SourceEnum'
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        currency:
          type: string
          maxLength: 3
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        tax_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        discount_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        tip_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        service_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - currency
      - public_id
      - restaurant
      - session
      - updated_at
    OrderItem:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
        order:
          type: integer
          readOnly: true
        ticket:
          type: integer
          readOnly: true
        menu_item:
          type: integer
          readOnly: true
        guest_slot:
          type: integer
          maximum: 2147483647
          minimum: 0
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          nullable: true
        modifiers:
          nullable: true
        status:
          $ref: '#/components/schemas/OrderItemStatusEnum'
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        voided_at:
          type: string
          format: date-time
          nullable: true
        voided_by:
          type: integer
          readOnly: true
        void_reason:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/VoidReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - guest_slot
      - menu_item
      - order
      - public_id
      - quantity
      - restaurant
      - ticket
      - unit_price
      - updated_at
      - voided_by
    OrderItemStatusEnum:
      enum:
      - pending
      - in_progress
      - ready
      - served
      - voided
      type: string
      description: |-
        * `pending` - Pending
        * `in_progress` - In progress
        * `ready` - Ready
        * `served` - Served
        * `voided` - Voided
    OrderStatusEnum:
      enum:
      - draft
      - submitted
      - completed
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `completed` - Completed
        * `cancelled` - Cancelled
    Payment:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
          readOnly: true
        order:
          type: integer
          readOnly: true
        provider:
          type: string
          maxLength: 64
        provider_transaction_id:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        currency:
          type: string
          maxLength: 3
        status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        raw_payload:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - order
      - provider
      - provider_transaction_id
      - public_id
      - restaurant
      - updated_at
    PaymentStatusEnum:
      enum:
      - unpaid
      - authorized
      - paid
      - settled
      - refunded
      - cancelled
      type: string
      description: |-
        * `unpaid` - Unpaid
        * `authorized` - Authorized
        * `paid` - Paid
        * `settled` - Settled
        * `refunded` - Refunded
        * `cancelled` - Cancelled
    Reservation:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
        customer:
          type: integer
          readOnly: true
        table:
          type: integer
          readOnly: true
        guest_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ReservationStatusEnum'
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - end_at
      - guest_count
      - public_id
      - restaurant
      - start_at
      - table
      - updated_at
    ReservationStatusEnum:
      enum:
      - pending
      - confirmed
      - cancelled
      - completed
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `cancelled` - Cancelled
        * `completed` - Completed
    Restaurant:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        address:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - created_at
      - name
      - public_id
      - updated_at
    RestaurantSettings:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        restaurant:
          type: integer
          readOnly: true
        timezone:
          type: string
          maxLength: 64
        currency:
          type: string
          maxLength: 3
        locale:
          type: string
          maxLength: 16
        default_tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        default_service_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,4})?$
        working_hours: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
