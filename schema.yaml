      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorTable'
          description: ''
    patch:
      operationId: editor_tables_partial_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - Editor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditorTable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEditorTable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEditorTable'
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorTable'
          description: ''
  /api/editor/tables/available/:
    get:
      operationId: editor_tables_available_list
      parameters:
      - in: query
        name: end_at
        schema:
          type: string
        description: ISO 8601 datetime
        required: true
      - in: query
        name: guest_count
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: start_at
        schema:
          type: string
        description: ISO 8601 datetime
        required: true
      tags:
      - Editor
      security:
      - jwtAuth: []
      - jwt_Auth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEditorTableList'
          description: ''
