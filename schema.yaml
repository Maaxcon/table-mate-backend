components:
  schemas:
    ActionEnum:
      enum:
      - set_available
      - set_category
      - delete
      type: string
      description: |-
        * `set_available` - set_available
        * `set_category` - set_category
        * `delete` - delete
    AdminMenu:
      type: object
      description: Writable menu serializer for the admin panel.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - name
      - public_id
      - updated_at
    AdminMenuCategory:
      type: object
      description: |-
        Writable category serializer. The menu is referenced by its public id and
        must belong to the admin's restaurant (validated in the view's queryset).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        menu:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - menu
      - name
      - public_id
      - updated_at
    AdminMenuItem:
      type: object
      description: |-
        Writable menu item serializer for the admin panel. Menu and category are
        referenced by public id and limited to the admin's restaurant in the view.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        menu:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        ingredients:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        weight_grams:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        is_available:
          type: boolean
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        likes_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - likes_count
      - menu
      - name
      - price
      - public_id
      - updated_at
    AdminOverview:
      type: object
      description: Counts for the admin dashboard, scoped to the admin's restaurant.
      properties:
        menus_total:
          type: integer
        menus_active:
          type: integer
        dishes_total:
          type: integer
        dishes_hidden:
          type: integer
        categories_total:
          type: integer
        staff_total:
          type: integer
        staff_active:
          type: integer
      required:
      - categories_total
      - dishes_hidden
      - dishes_total
      - menus_active
      - menus_total
      - staff_active
      - staff_total
    BulkItemAction:
      type: object
      description: |-
        A bulk operation over several menu items, selected by public id.

        - ``set_available`` needs ``is_available``
        - ``set_category`` needs ``category`` (may be null to clear it)
        - ``delete`` needs nothing else
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
        action:
          $ref: '#/components/schemas/ActionEnum'
        is_available:
          type: boolean
        category:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - ids
    CreatedBySourceEnum:
      enum:
      - staff
      - customer
      - system
      type: string
      description: |-
        * `staff` - Staff
        * `customer` - Customer
        * `system` - System
    CustomTokenObtainPair:
      type: object
      properties:
        restaurant_id:
          type: integer
          nullable: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - access
      - email
      - password
      - refresh
    EditorTable:
