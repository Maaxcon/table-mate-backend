name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: table_mate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d table_mate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/table_mate_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Seed pip into virtual environment
        run: uv pip install pip

      - name: Lint with ruff
        run: uv run ruff check apps core common manage.py

      - name: Type check with mypy
        run: uv run mypy apps core common manage.py

      - name: Export requirements for auditing
        run: uv pip compile pyproject.toml -o requirements-audit.txt

      - name: Security check with bandit
        run: uv run bandit -r apps core common manage.py

      - name: Vulnerability scan
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-audit.txt
          ignore-vulns: PYSEC-2025-183

      - name: Schema drift gate
        run: |
          uv run python manage.py spectacular --validate --file /tmp/schema.yaml
          diff /tmp/schema.yaml schema.yaml

      - name: Migration drift gate
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest



  build-and-push:
      name: Build and Push Docker Images
      needs: test
      runs-on: ubuntu-latest
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Authenticate to Google Cloud
          uses: google-github-actions/auth@v2
          with:
            credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'

        - name: Configure Docker for GAR
          run: gcloud auth configure-docker europe-docker.pkg.dev --quiet

        - name: Build and Push Backend
          run: |
            IMAGE=europe-docker.pkg.dev/auth-server-381211/table-mate/backend/develop
            docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} -f Dockerfile .
            docker push $IMAGE --all-tags