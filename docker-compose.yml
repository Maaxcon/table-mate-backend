version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: table_mate
      POSTGRES_USER: table_mate_user
      POSTGRES_PASSWORD: table_mate_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.local
      DATABASE_URL: postgresql://table_mate_user:table_mate_pass@db:5432/table_mate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
  worker:
    build: .
    command: celery -A core worker -l info
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.local
      DATABASE_URL: postgresql://table_mate_user:table_mate_pass@db:5432/table_mate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
  beat:
    build: .
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.local
      DATABASE_URL: postgresql://table_mate_user:table_mate_pass@db:5432/table_mate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
  test:
    build:
      context: .
      target: test
    command: uv run pytest tests/ -v
    volumes:
      - .:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql://table_mate_user:table_mate_pass@db:5432/table_mate
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: core.settings.local
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ../table-mate-frontend
      target: build
    command: npx vite --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ""
      VITE_WS_URL: ws://localhost:8000/ws
      VITE_GOOGLE_CLIENT_ID: 194097055062-d8bmdj8m0hm1k17sfbpg182kcb5raeoh.apps.googleusercontent.com
      API_PROXY_TARGET: http://web:8000
    ports:
      - "${FRONTEND_EXPOSED_PORT:-5173}:5173"
    volumes:
      - ../table-mate-frontend:/app
      - /app/node_modules
    depends_on:
      web:
        condition: service_started

  llm-service:
    image: ollama/ollama:latest
    container_name: table_mate_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama  # Persists downloaded models on host
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/workspace/table-mate-backend:rw
      - ../table-mate-frontend:/workspace/table-mate-frontend:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WORKSPACE_DIR=/workspace
      - HTTP_PROXY=http://host.docker.internal:9052
      - HTTPS_PROXY=http://host.docker.internal:9052
      - NO_PROXY=localhost,127.0.0.1,db,redis,web,frontend,worker,beat
    working_dir: /workspace
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
volumes:
  postgres_data:
  ollama_storage: