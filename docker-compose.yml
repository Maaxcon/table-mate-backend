version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: table_mate
      POSTGRES_USER: table_mate_user
      POSTGRES_PASSWORD: table_mate_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.local
      # override localhost → docker service name
      DATABASE_URL: postgresql://table_mate_user:table_mate_pass@db:5432/table_mate
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
  test:
    build:
      context: .
      target: test
    command: uv run pytest tests/ -v
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://table_mate_user:table_mate_pass@db:5432/table_mate
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: core.settings.local
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
volumes:
  postgres_data:
