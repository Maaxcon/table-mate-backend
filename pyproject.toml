[project]
name = "table-mate"
version = "0.1.0"
dependencies = [
    "django>=5.0",
    "django-filter",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "django-environ",
    "google-auth",
    "django-cors-headers",
    "psycopg2-binary",
    "channels",
    "channels-redis",
    "daphne",
    "drf-spectacular",
    "pillow",
    "celery[redis]",
    "django-celery-beat",
    "qrcode>=8.2",
]
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["D203", "D213"]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
explicit_package_bases = true
namespace_packages = true


[tool.django-stubs]
django_settings_module = "core.settings.local"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "django-stubs[compatible-mypy]>=6.0.4",
    "djangorestframework-stubs[compatible-mypy]>=3.17.0",
    "drf-spectacular>=0.29.0",
    "pre-commit>=4.6.0",
    "factory-boy>=3.3.3",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-asyncio>=0.24.0",
    "factory-boy>=3.3.0",
    "ruff>=0.15.13",
    "safety>=3.0.0",
]
prod = [
    "gunicorn>=26.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.local"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["core", "apps", "common"]
